name: ci

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Run tests and staticcheck
    runs-on: ubuntu-slim
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ~1.27
          check-latest: true

      - name: Run tests
        run: go test ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
